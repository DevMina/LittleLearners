<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – My Progress</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
  </div>

  <div class="title-wrap">
    <h1 id="digestTitle">My Progress</h1>
  </div>

  <button class="icon-btn" id="shareBtn" style="margin-bottom:6px; width:100%; max-width:560px;">📤 Share progress</button>
  <div id="shareStatus" class="record-status" style="margin-bottom:12px; max-width:560px;"></div>

  <div class="digest-panel">
    <div class="settings-group">
      <h3>This week</h3>
      <div class="week-row" id="weekRow"></div>
      <p id="streakLine" class="backup-note"></p>
    </div>

    <div class="settings-group">
      <h3>Badges earned</h3>
      <div id="badgesSummary" class="badge-grid"></div>
    </div>

    <div class="settings-group">
      <h3>Decks completed</h3>
      <div id="decksSummary" class="progress-summary"></div>
    </div>

    <div class="settings-group">
      <h3>Games</h3>
      <div id="gamesSummary" class="progress-summary"></div>
    </div>

    <div class="settings-group" id="weakSpotsGroup" style="display:none;">
      <h3>Needs a little practice</h3>
      <div id="weakSpotsSummary" class="progress-summary"></div>
      <button class="icon-btn" onclick="location.href='review.html'" style="width:100%;">🧠 Go review</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/digest.js"></script>
<footer class="site-footer">
  <p>© <span id="footerYear"></span> Mina Abdo. All rights reserved.</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

</body>
</html>
