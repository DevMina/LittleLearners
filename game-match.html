<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – Memory Match</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
    <button class="icon-btn" id="restartBtn">🔁 Restart</button>
  </div>

  <div class="title-wrap">
    <h1>Memory Match</h1>
    <p>Find the matching pairs!</p>
  </div>

  <div class="word-bank" id="deckPicker" style="max-width:640px;"></div>

  <div class="stat-row">
    <div class="stat-pill">🕹️ Moves: <span id="movesCount">0</span></div>
    <div class="stat-pill">✅ Pairs: <span id="pairsCount">0</span>/<span id="pairsTotal">8</span></div>
  </div>

  <div class="game-board match-grid" id="board"></div>
</div>

<div class="win-banner" id="winBanner" style="display:none;">
  <div class="confetti-host" id="confettiHost"></div>
  <div class="win-card">
    <h2>🎉 Great job!</h2>
    <p id="winStats">You found all the pairs!</p>
    <button class="play-again-btn" id="playAgainBtn">Play again</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/game-match.js"></script>
</body>
</html>
