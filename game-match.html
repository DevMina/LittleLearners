<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – Memory Match</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
    <button class="icon-btn" id="restartBtn">🔁 Restart</button>
  </div>

  <div class="title-wrap">
    <h1>Memory Match</h1>
    <p>Find the matching pairs!</p>
  </div>

  <div class="deck-picker-row">
    <button class="deck-current" id="deckCurrentBtn" type="button" aria-haspopup="dialog">
      <span class="deck-current-dot" id="deckCurrentDot"></span>
      <span id="deckCurrentLabel">Animals</span>
      <span class="deck-current-chevron">▾</span>
    </button>
    <button class="deck-change-btn" id="deckChangeBtn" type="button" aria-label="Change category">🔀</button>
  </div>

  <div class="deck-modal-overlay" id="deckModalOverlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Choose a category">
    <div class="deck-modal-card">
      <div class="deck-modal-head">
        <h2>Choose a category</h2>
        <button class="deck-modal-close" id="deckModalCloseBtn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="deck-grid" id="deckGrid"></div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-pill">🕹️ Moves: <span id="movesCount">0</span></div>
    <div class="stat-pill">✅ Pairs: <span id="pairsCount">0</span>/<span id="pairsTotal">8</span></div>
  </div>

  <div class="match-board-panel">
    <div class="game-board match-grid" id="board"></div>
  </div>
</div>

<div class="win-banner" id="winBanner" style="display:none;">
  <div class="confetti-host" id="confettiHost"></div>
  <div class="win-card">
    <h2>🎉 Great job!</h2>
    <p id="winStats">You found all the pairs!</p>
    <button class="play-again-btn" id="playAgainBtn">Play again</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/game-match.js"></script>
<footer class="site-footer">
  <p>© <span id="footerYear"></span> Mina Abdo. All rights reserved.</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

</body>
</html>
