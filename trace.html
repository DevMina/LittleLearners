<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – Tracing</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
    <div class="mode-toggle" id="modeToggle" role="group" aria-label="Choose letters or numbers">
      <button class="mode-toggle-btn active" id="modeLettersBtn" type="button">🔤 Letters</button>
      <button class="mode-toggle-btn" id="modeNumbersBtn" type="button">🔢 Numbers</button>
    </div>
  </div>

  <div class="title-wrap">
    <h1>Tracing</h1>
    <p>Trace it with your finger!</p>
  </div>

  <div class="trace-stage">
    <canvas id="traceCanvas" width="320" height="380"></canvas>
    <div class="controls-row">
      <button class="nav-btn" id="prevBtn">&larr;</button>
      <button class="icon-btn" id="clearBtn">🧹 Clear</button>
      <button class="nav-btn" id="nextBtn">&rarr;</button>
    </div>
    <button class="play-again-btn" id="doneBtn">✅ I'm done!</button>
  </div>
</div>

<div class="win-banner" id="winBanner" style="display:none;">
  <div class="confetti-host" id="confettiHost"></div>
  <div class="win-card">
    <h2 id="winTitle">✏️ Nice tracing!</h2>
    <p id="winStats">Great work!</p>
    <button class="play-again-btn" id="nextLetterBtn">Next one</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/trace.js"></script>
<footer class="site-footer">
  <p>© <span id="footerYear"></span> Mina Abdo. All rights reserved.</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

</body>
</html>
