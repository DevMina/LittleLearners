<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – Cards</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
    <button class="icon-btn" id="shuffleBtn">🔀 Shuffle</button>
  </div>

  <div class="title-wrap">
    <h1 id="deckTitle">Deck</h1>
  </div>

  <div class="card-stage">
    <div class="flashcard" id="flashcard"></div>
    <div class="card-label" id="cardLabel"></div>

    <div class="controls-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous">&larr;</button>
      <button class="speak-btn" id="speakBtn">🔊 Say it</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next">&rarr;</button>
    </div>

    <div class="progress-dots" id="progressDots"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/cards.js"></script>
</body>
</html>
