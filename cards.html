<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners – Cards</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">&larr; Home</button>
    <div class="top-bar-actions">
      <button class="icon-btn" id="gridBtn">▦ See all</button>
      <button class="icon-btn" id="printLinkBtn">🖨️ Print</button>
      <button class="icon-btn" id="shuffleBtn">🔀 Shuffle</button>
    </div>
  </div>

  <div class="title-wrap">
    <h1 id="deckTitle">Deck</h1>
  </div>

  <div class="card-stage">
    <div class="flashcard" id="flashcard"></div>
    <div class="card-label" id="cardLabel"></div>

    <div class="controls-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous">&larr;</button>
      <button class="speak-btn" id="speakBtn">🔊 Say it</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next">&rarr;</button>
    </div>
    <button class="icon-btn" id="micBtn">🎤 Your turn! Try it</button>
    <div id="micStatus" class="record-status"></div>

    <div class="progress-dots" id="progressDots"></div>
  </div>
</div>

<div class="overview-modal" id="overviewModal" style="display:none;">
  <div class="overview-panel">
    <div class="overview-header">
      <h2 id="overviewTitle">All cards</h2>
      <button class="icon-btn" id="closeOverviewBtn">✕ Close</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/cards.js"></script>
<footer class="site-footer">
  <p>© <span id="footerYear"></span> Mina Abdo. All rights reserved.</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

</body>
</html>
