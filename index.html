<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Little Learners</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FC9F3">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="top-bar">
    <button class="icon-btn" onclick="location.href='settings.html'" aria-label="Parent settings">⚙️ Parents</button>
    <div class="top-bar-actions">
      <button class="icon-btn" id="installBtn" style="display:none;" aria-label="Install app">⬇️ Install app</button>
    </div>
  </div>

  <div class="ios-hint-card" id="iosHintCard" style="display:none;">
    <span class="ios-hint-emoji">📲</span>
    <div class="ios-hint-text">
      <strong>Add to your Home Screen:</strong> tap the Share button <span class="ios-share-glyph">⬆️</span> below, then choose "Add to Home Screen".
    </div>
    <button class="ios-hint-close" data-ios-hint-dismiss aria-label="Dismiss">✕</button>
  </div>

  <div class="home-topline">
    <button class="profile-chip" id="profileChip" aria-label="Switch learner"></button>
    <div class="home-topline-chips">
      <div class="streak-chip" id="streakChip" style="display:none;"></div>
      <div class="streak-chip badge-chip-home" id="badgeChip" style="display:none;"></div>
    </div>
  </div>
  <p class="streak-nudge" id="streakNudge" style="display:none;"></p>

  <div class="title-wrap">
    <svg class="mascot" id="mascot" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="Say hello" tabindex="0">
      <ellipse cx="60" cy="78" rx="42" ry="38" fill="#1F3A5F" opacity="0.28"/>
      <ellipse cx="60" cy="70" rx="42" ry="38" fill="#FFD93D"/>
      <circle cx="44" cy="62" r="7" fill="#1F3A5F"/>
      <circle cx="76" cy="62" r="7" fill="#1F3A5F"/>
      <circle cx="46" cy="60" r="2" fill="#fff"/>
      <circle cx="78" cy="60" r="2" fill="#fff"/>
      <path d="M42 82 Q60 96 78 82" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" fill="none"/>
      <ellipse cx="30" cy="76" rx="7" ry="5" fill="#FF9F45" opacity="0.6"/>
      <ellipse cx="90" cy="76" rx="7" ry="5" fill="#FF9F45" opacity="0.6"/>
      <ellipse cx="60" cy="32" rx="10" ry="14" fill="#FFD93D"/>
      <g id="accessoryBow" class="mascot-accessory" style="display:none;">
        <path d="M50 46 L38 38 L38 54 Z" fill="#FF6B6B"/>
        <path d="M70 46 L82 38 L82 54 Z" fill="#FF6B6B"/>
        <circle cx="60" cy="46" r="5" fill="#FF6B6B"/>
      </g>
      <g id="accessoryHat" class="mascot-accessory" style="display:none;">
        <path d="M40 30 L60 6 L80 30 Z" fill="#9B72CF"/>
        <circle cx="60" cy="6" r="5" fill="#FFD93D"/>
      </g>
      <g id="accessoryGlasses" class="mascot-accessory" style="display:none;">
        <circle cx="44" cy="62" r="10" fill="none" stroke="#1F3A5F" stroke-width="3"/>
        <circle cx="76" cy="62" r="10" fill="none" stroke="#1F3A5F" stroke-width="3"/>
        <line x1="54" y1="62" x2="66" y2="62" stroke="#1F3A5F" stroke-width="3"/>
      </g>
    </svg>
    <h1>Little Learners</h1>
    <p>Tap, learn, and play!</p>
  </div>

  <button class="today-session-btn" id="todaySessionBtn">
    <span class="today-session-emoji">▶️</span>
    <span class="today-session-text">
      <strong>Start today's practice</strong>
      <span id="todaySessionSub">A quick pick just for today</span>
    </span>
  </button>

  <div class="section-label">Flashcard decks</div>
  <div class="tile-grid" id="deckTiles"></div>

  <div class="section-label">Games & activities</div>
  <div class="tile-grid">
    <button class="tile orange" onclick="location.href='game-match.html?deck=animals'">
      <span class="tile-emoji">🧩</span>Memory Match
    </button>
    <button class="tile coral" onclick="location.href='game-find.html?deck=animals'">
      <span class="tile-emoji">🔍</span>Find It!
    </button>
    <button class="tile grape" onclick="location.href='trace.html?mode=letters'">
      <span class="tile-emoji">✏️</span>Tracing
    </button>
    <button class="tile grass" onclick="location.href='sentence.html'">
      <span class="tile-emoji">💬</span>Sentence Builder
    </button>
    <button class="tile teal" onclick="location.href='story.html'">
      <span class="tile-emoji">📖</span>Story Time
    </button>
    <button class="tile magenta" onclick="location.href='review.html'">
      <span class="tile-emoji">🧠</span>Review
    </button>
    <button class="tile sun" onclick="location.href='digest.html'">
      <span class="tile-emoji">📊</span>My Progress
    </button>
  </div>

</div>
<script src="js/data.js"></script>
<script src="js/profiles.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
  if (!requireProfile()) { /* redirecting to profile picker */ }

  const activeProfile = getActiveProfile();
  if (activeProfile) {
    const chip = document.getElementById("profileChip");
    chip.innerHTML = `<span>${activeProfile.emoji}</span> ${activeProfile.name}`;
    chip.addEventListener("click", () => (location.href = "profiles.html"));

    const streak = getStreak();
    if (streak > 1) {
      const streakChip = document.getElementById("streakChip");
      streakChip.style.display = "inline-block";
      streakChip.textContent = "🔥 " + streak + " day streak";
    } else {
      // Gentle nudge instead of a chip when there's no streak going yet (or it's brand new)
      const nudge = document.getElementById("streakNudge");
      nudge.style.display = "block";
      nudge.textContent = streak === 1 ? "🔥 Nice! Come back tomorrow to grow your streak." : "✨ Play today to start a streak!";
    }

    const masteredDecks = getMasteredDecks();
    if (masteredDecks.length > 0) {
      const badgeChip = document.getElementById("badgeChip");
      badgeChip.style.display = "inline-block";
      badgeChip.textContent = "🏆 " + masteredDecks.length + " badge" + (masteredDecks.length === 1 ? "" : "s");
      badgeChip.title = masteredDecks.map((k) => DECKS[k].title).join(", ");
    }

    // Mascot unlocks based on total stars earned
    const totalStars = getTotalStars();
    if (totalStars >= 3) document.getElementById("accessoryBow").style.display = "block";
    if (totalStars >= 7) document.getElementById("accessoryHat").style.display = "block";
    if (totalStars >= 13) document.getElementById("accessoryGlasses").style.display = "block";

    // "Today's session" — one-tap pick of a deck + game, favoring weak items or a fresh deck
    const session = pickTodaysSession();
    if (DECKS[session.deckKey]) {
      document.getElementById("todaySessionSub").textContent = session.gameLabel + " · " + DECKS[session.deckKey].title;
    }
    document.getElementById("todaySessionBtn").addEventListener("click", () => (location.href = session.url));
  }

  // Build deck tiles from settings (parent-enabled decks only)
  const tileMeta = {
    animals: { color: "coral", emoji: "🐶" },
    colors: { color: "grape", emoji: "🎨" },
    numbers: { color: "grass", emoji: "🔢" },
    shapes: { color: "sun", emoji: "⭐" },
    letters: { color: "teal", emoji: "🔤" },
    vehicles: { color: "magenta", emoji: "🚗" },
    food: { color: "orange", emoji: "🍎" },
    bodyParts: { color: "rose", emoji: "✋" },
    emotions: { color: "peach", emoji: "😄" },
    opposites: { color: "olive", emoji: "⬆️" },
    sightWords: { color: "tan", emoji: "💬" },
  };
  const enabled = getSettings().enabledDecks;
  const wrap = document.getElementById("deckTiles");
  enabled.forEach((key) => {
    if (!DECKS[key]) return;
    const meta = tileMeta[key] || { color: "tan", emoji: "🃏" };
    const stars = getDeckStars(key);
    const btn = document.createElement("button");
    btn.className = "tile " + meta.color;
    btn.onclick = () => (location.href = "cards.html?deck=" + key);
    btn.innerHTML = `<span class="tile-emoji">${meta.emoji}</span>${DECKS[key].title}${stars ? '<span class="tile-star">⭐</span>' : ""}`;
    wrap.appendChild(btn);
  });

  document.getElementById("mascot").addEventListener("click", function () {
    mascotBounce(this, "cheer");
    speak("Hi! Let's play!");
  });
  document.getElementById("mascot").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
  });
  window.addEventListener("load", () => mascotBounce(document.getElementById("mascot")));

  // iOS Safari can't fire beforeinstallprompt — show a manual instruction card instead
  initIOSInstallHint(document.getElementById("iosHintCard"));

  // PWA install prompt
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-block";
  });
  document.getElementById("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
  });
</script>
<footer class="site-footer">
  <p>© <span id="footerYear"></span> Mina Abdo. All rights reserved.</p>
  <div class="footer-links">
    <a href="contact.html">Contact Us</a>
  </div>
</footer>

</body>
</html>
